server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location /submit {
        proxy_pass http://backend:5000; # 'backend' — имя контейнера
    }
    location = /data.csv {
        root /usr/share/nginx/html;
        add_header Content-Disposition 'attachment; filename="data.csv"';
    }
}