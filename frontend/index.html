<html>
    <head>
        <meta charset="utf-8">
        <title>Главная страница</title>
    </head>
    <body>
        <h1>Регистрация</h1>
        <p>Заполните данные о себе и о ноутбуке</p>

        <form action="/submit" method="post">
            <label>Имя: <input type="text" name="first_name" required></label><br>
            <label>Фамилия: <input type="text" name="last_name" required></label><br>
            <label>Номер ноутбука: <input type="text" name="laptop_number" required></label><br>
            <button type="submit">Отправить</button>
        </form>
    </body>
</html>
